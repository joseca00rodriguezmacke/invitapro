<!doctype html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Creador · InvitaPro</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .studio { display: grid; gap: 0; }
  @media (min-width: 1000px) { .studio { grid-template-columns: minmax(420px, 1fr) 440px; gap: 28px; align-items: start; } }
  .editor { min-width: 0; }
  .preview { position: sticky; top: 76px; display: none; }
  @media (min-width: 1000px) { .preview { display: block; } }
  .studio.show-preview .preview { display: block; position: fixed; inset: 64px 0 0; z-index: 30; background: var(--bg); padding: 12px; }
  .phone { position: relative; width: 390px; max-width: 100%; height: min(820px, calc(100vh - 150px)); margin: 0 auto; border-radius: 44px; padding: 12px; background: #111; box-shadow: 0 30px 80px -30px rgb(0 0 0 / .6), inset 0 0 0 2px #333; }
  .studio.show-preview .phone { height: calc(100vh - 150px); }
  .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 34px; background: #fff; }
  .phone::before { content: ""; position: absolute; top: 20px; left: 50%; width: 90px; height: 24px; margin-left: -45px; border-radius: 20px; background: #000; z-index: 2; }
  .pv-bar { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .acc { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px; overflow: hidden; }
  .acc > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; align-items: center; gap: 12px; font-weight: 700; }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc > summary .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--primary); font-size: .85em; flex: none; }
  .acc > summary small { font-weight: 500; color: var(--muted); margin-left: auto; font-size: .82em; text-align: right; }
  .acc > summary::after { content: "›"; transform: rotate(90deg); transition: .2s; color: var(--muted); font-size: 1.3em; }
  .acc[open] > summary::after { transform: rotate(-90deg); }
  .acc .body { padding: 4px 18px 18px; }
  .g2 { display: grid; gap: 0 12px; } @media (min-width: 560px) { .g2 { grid-template-columns: 1fr 1fr; } }
  .rep { border: 1px dashed var(--line); border-radius: 14px; padding: 12px 12px 2px; margin-bottom: 10px; position: relative; background: var(--bg); }
  .rep .rm { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; z-index: 1; }
  .rep .mv { position: absolute; top: 8px; right: 46px; display: flex; gap: 4px; }
  .rep .mv button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
  .themes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; } @media (min-width: 560px) { .themes { grid-template-columns: repeat(3, 1fr); } }
  .th { position: relative; border: 2px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; background: var(--surface); padding: 0; text-align: left; transition: .2s; }
  .th[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent); }
  .th .sw { height: 74px; position: relative; display: grid; place-items: center; overflow: hidden; }
  .th .sw svg { position: absolute; width: 70px; top: 4px; left: 4px; opacity: .8; }
  .th .sw b { position: relative; font-size: 1.4em; }
  .th .nm { padding: 8px 10px; font-size: .85em; font-weight: 600; display: block; }
  .pals { display: flex; gap: 10px; flex-wrap: wrap; }
  .pal { display: flex; border-radius: 999px; overflow: hidden; border: 2px solid var(--line); cursor: pointer; padding: 0; background: none; }
  .pal i { width: 22px; height: 30px; } .pal span { padding: 0 10px; align-self: center; font-size: .8em; font-weight: 600; background: var(--surface); height: 30px; line-height: 30px; }
  .pal[aria-pressed="true"] { border-color: var(--primary); }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; flex-wrap: wrap; gap: 2px; }
  .seg button { border: 0; background: none; padding: .5em 1em; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .88em; min-height: 38px; }
  .seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
  .opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; } @media (min-width: 560px) { .opts { grid-template-columns: repeat(4, 1fr); } }
  .opt { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; background: var(--surface); font-size: .85em; font-weight: 600; min-height: 54px; }
  .opt[aria-pressed="true"] { border-color: var(--primary); background: var(--soft); color: var(--primary); }
  .feats { display: grid; grid-template-columns: 1fr; gap: 6px; } @media (min-width: 560px) { .feats { grid-template-columns: 1fr 1fr; } }
  .feats label { display: flex; gap: 8px; align-items: center; font-size: .9em; padding: 6px 8px; border-radius: 10px; background: var(--bg); }
  .feats label.ov { outline: 1.5px dashed var(--primary); }
  .plans { display: grid; gap: 10px; } @media (min-width: 560px) { .plans { grid-template-columns: repeat(3, 1fr); } }
  .plan { border: 2px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer; background: var(--surface); text-align: left; }
  .plan[aria-pressed="true"] { border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 15%, transparent); }
  .plan b { font-size: 1.1em; } .plan .pr { font-family: var(--f-display); font-size: 1.6em; color: var(--primary); display: block; }
  .plan ul { margin: 6px 0 0; padding-left: 18px; font-size: .82em; color: var(--muted); }
  .steps { display: flex; gap: 6px; margin: 10px 0 16px; }
  .steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); } .steps i.on { background: var(--primary); }
  .navbar { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); }
  .navbar .btn { flex: 1; }
  .imgf { display: flex; gap: 8px; } .imgf input[type=text] { flex: 1; } .imgf label.btn { flex: none; }
  .gtable td input { min-height: 36px; padding: .3em .5em; }
  .mobile-tabs { display: flex; gap: 8px; } @media (min-width: 1000px) { .mobile-tabs { display: none; } }
  .links { display: grid; gap: 8px; } .links .row { justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
  .links code { font-size: .78em; word-break: break-all; color: var(--muted); }
</style>
</head>
<body class="app">
<header class="topbar"><a class="brand" href="./"><img src="assets/img/favicon.svg" alt="">InvitaPro</a><span class="chip" id="modeChip">Creador</span><span class="sp"></span>
  <div class="mobile-tabs"><button class="btn sm ghost" type="button" id="pvToggle">Vista previa</button></div></header>
<main class="app-main">
  <div class="studio" id="studio">
    <div class="editor" id="editor"></div>
    <aside class="preview" aria-label="Vista previa">
      <div class="phone"><iframe id="pv" title="Vista previa de la invitación" src="invitacion.html?preview=1"></iframe></div>
      <div class="pv-bar"><button class="btn sm" type="button" id="pvOpen">▶ Probar apertura</button><button class="btn sm ghost" type="button" id="pvGuest">Ver como invitado</button></div>
    </aside>
  </div>
</main>
<dialog id="dlg"><div class="dh"><h2 id="dlg-t"></h2><button class="x-btn" type="button" aria-label="Cerrar" onclick="this.closest('dialog').close()">×</button></div><div class="db" id="dlg-b"></div></dialog>
<script src="config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/themes.js"></script>
<script src="assets/js/ornaments.js"></script>
<script src="assets/js/creador.js"></script>
</body>
</html>
